# Increase GPU shader disk cache size for gaming.
# Default driver limits (~1GB) are often too small for modern titles.
#
# Installed by cachyos-gaming-meta. Override in:
#   /etc/environment.d/*.conf     (system-wide; prefer 60-90 prefix)
#   ~/.config/environment.d/*.conf (per-user)

# AMD / Intel (Mesa)
MESA_SHADER_CACHE_MAX_SIZE=12G

# NVIDIA
__GL_SHADER_DISK_CACHE_SIZE=12000000000
